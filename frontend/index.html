    <meta charset="UTF-8" />

    <meta
      name="description"
      content="KYMA — people, places, passions. News, music, culture, and local events, organized by what you choose to see, not by what keeps you scrolling."
    />
    <meta name="theme-color" content="#0B2E2B" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Applied before React mounts so the picked theme is present on the
      // very first paint instead of flashing the default first.
      (function () {
        var VALID = ["classic", "midnight", "orchard", "terracotta", "pop", "vintage"];
        try {
          var stored = localStorage.getItem("agora_theme");
          document.documentElement.dataset.theme = VALID.indexOf(stored) !== -1 ? stored : "midnight";
        } catch (e) {
          document.documentElement.dataset.theme = "midnight";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
