# Extends Keycloak's default v2 login theme with KYMA's own branding —
# layout, form behavior, Google IdP button, etc. all stay exactly as
# Keycloak provides; only colors/fonts/spacing are overridden, via a CSS
# file loaded after the base styles (see styles.css below).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/kyma.css
