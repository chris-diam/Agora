services:
  postgres:
    image: postgres:16-alpine
    container_name: social_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: social_platform
      POSTGRES_PASSWORD: social_platform
      POSTGRES_DB: social_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local-dev-only identity provider, matched to production Keycloak by the
  # exported realm below. `start-dev` needs no real database (embedded
  # storage) — good enough for iterating on the realm/client config; the
  # production instance (Render) is configured separately and persists to
  # its own Neon database.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: social_platform_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import

volumes:
  postgres_data:
